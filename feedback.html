<!DOCTYPE html><html lang="en" class="scroll-smooth"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feedback — Design review</title>
<meta name="description" content="Reviewer notes on the new LastPass support page designs, with status.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="templates.css">
<style>
 body{font-family:'Source Sans 3',Arial,sans-serif;-webkit-font-smoothing:antialiased}
 #nav.is-scrolled{box-shadow:0 8px 24px -18px rgba(5,6,6,.4)}
 .navlink{position:relative}.navlink::after{content:'';position:absolute;left:0;bottom:14px;height:2px;width:0;background:var(--lp-brand);transition:width .28s cubic-bezier(.2,.7,.2,1);z-index:2}.navlink:hover::after,.navdd:hover>.navlink::after,.navdd.open>.navlink::after,.navdd:focus-within>.navlink::after{width:100%}
 .btn{transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .2s,background-color .18s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(0) scale(.985)}
 /* Hero matches reader header: aubergine → mid purple; arcs barely visible (Eric: remove concentric circles) */
 .hero{position:relative;isolation:isolate;background:linear-gradient(120deg,var(--lp-aubergine,#3d2a4b) 0%,var(--lp-aubergine-mid,#5e4270) 100%)}
 .hero-bg{position:absolute;inset:0;background:url('img/hero-pattern-live.jpg') center/cover no-repeat;opacity:.15;pointer-events:none}
 .hero-scrim{position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,#3d2a4b 0%,rgba(61,42,75,.95) 40%,rgba(94,66,112,.78) 72%,rgba(94,66,112,.5) 100%)}
 .hero-copy{color:#fff;text-shadow:none}
 .searchwrap{display:flex;align-items:center;flex-wrap:nowrap;gap:.5rem;width:100%;max-width:42rem;margin-left:auto;margin-right:auto;background:#fff;border:1px solid #e5ecf4;border-radius:.75rem;padding:.375rem .375rem .375rem 1rem;box-shadow:0 20px 50px -28px rgba(0,0,0,.55);transition:box-shadow .3s cubic-bezier(.16,1,.3,1),transform .3s cubic-bezier(.16,1,.3,1),border-color .2s}
 .searchwrap:focus-within{box-shadow:0 0 0 4px rgba(215,19,64,.25),0 30px 70px -26px rgba(0,0,0,.7);border-color:#d71340;transform:translateY(-1px)}
 .searchwrap input{flex:1 1 auto;min-width:0;height:2.75rem;border:0;background:transparent;outline:none;font-size:16px;color:#050606}
 .searchwrap button{flex:0 0 auto;height:2.75rem}
 .reveal{opacity:0;transform:translateY(12px);transition:opacity .35s cubic-bezier(.16,1,.3,1),transform .35s cubic-bezier(.16,1,.3,1)}.reveal.in{opacity:1;transform:none}
 [data-stagger].in>*{animation:rise .35s cubic-bezier(.16,1,.3,1) both}
 [data-stagger].in>*:nth-child(2){animation-delay:.04s}[data-stagger].in>*:nth-child(3){animation-delay:.08s}[data-stagger].in>*:nth-child(4){animation-delay:.12s}[data-stagger].in>*:nth-child(5){animation-delay:.16s}[data-stagger].in>*:nth-child(6){animation-delay:.2s}
 @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 .tile{transition:transform .35s cubic-bezier(.16,1,.3,1),box-shadow .35s,border-color .35s}.tile:hover{transform:translateY(-4px);box-shadow:0 20px 40px -28px rgba(5,6,6,.35)}
 .tile img{transition:transform .7s cubic-bezier(.16,1,.3,1)}.tile:hover img{transform:scale(1.05)}
 .qlink{transition:background-color .2s,color .2s,transform .2s cubic-bezier(.16,1,.3,1)}.qlink:hover{transform:translateY(-1px)}
 .rowlink{transition:background-color .2s}
 @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}.reveal{opacity:1!important;transform:none!important}}

 .navdd{position:relative}
 .navdd-btn{display:inline-flex;align-items:center;gap:.25rem;height:68px}
 .navdd-panel{display:none;position:absolute;left:0;top:100%;padding-top:.45rem;z-index:60}
 .navdd:hover .navdd-panel,.navdd:focus-within .navdd-panel,.navdd.open .navdd-panel{display:block}
 /* panel aesthetics (radius/shadow/hover) live in styles.css brand tokens */

 /* brand tokens + .cta-link defined in styles.css */
</style></head>
<body class="bg-white text-ink lib">
<a href="#main" class="sr-only focus:not-sr-only focus:absolute focus:z-[100] focus:top-3 focus:left-3 focus:bg-white focus:px-4 focus:py-2 focus:rounded-md focus:ring-2 focus:ring-brand-600 focus:font-semibold">Skip to main content</a>

<main id="main">
<header class="lib-head"><div class="t-wrap">
    <p class="lib-eyebrow">Design review</p>
    <h1>Feedback</h1>
    <p class="lib-sub">Every note from reviewers, across all pages.</p>
</div></header>
<div class="t-wrap fb-page">
  <div id="fb-board" class="fb-board" aria-live="polite"><p class="fb-empty">Loading notes…</p></div>
</div>
</main>

<button type="button" class="t-notes-toggle" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Show build notes</span></button>
<script src="templates.js" defer></script>
<script src="feedback.js" defer></script>
</body></html>
